services:
  backend:
    build:
      context: ../backend
    ports:
      - "5000:5000"
    env_file:
      - ../backend/.env
    volumes:
      - ../backend:/app
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
    ports:
      - "3000:3000"
    env_file:
      - ../frontend/.env.local
    volumes:
      - ../frontend:/app
    depends_on:
      - backend
    restart: unless-stopped
